name: Python Release

on:
  workflow_dispatch:
    inputs:
      following_version:
        description: "The post (dev) version to set"
      dry_run:
        description: "Dry Run?"
        default: false
        type: boolean
  schedule:
    - cron:  '30 5 * * *'

env:
  # Changes per repo
  PRODUCT_NAME: PyMongoCrypt
  EVERGREEN_PROJECT: libmongocrypt
  # Constant
  # inputs will be empty on a scheduled run.  so, we only set dry_run
  # to 'false' when the input is set to 'false'.
  DRY_RUN: ${{ ! contains(inputs.dry_run, 'false') }}
  FOLLOWING_VERSION: ${{ inputs.following_version || '' }}

defaults:
  run:
    shell: bash -eux {0}

jobs:
  pre-publish:
    environment: release-python
    if: github.repository_owner == 'mongodb' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      version: ${{ steps.pre-publish.outputs.version }}
    steps:
      - uses: mongodb-labs/drivers-github-tools/secure-checkout@11cb3898ea71493d38e8cdea7cc17b44320899e5  # v3.0.7
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: mongodb-labs/drivers-github-tools/setup@11cb3898ea71493d38e8cdea7cc17b44320899e5  # v3.0.7
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_REGION_NAME }}
          aws_secret_id: ${{ secrets.AWS_SECRET_ID }}
      - uses: mongodb-labs/drivers-github-tools/python/pre-publish@11cb3898ea71493d38e8cdea7cc17b44320899e5  # v3.0.7
        id: pre-publish
        with:
          working_directory: ./bindings/python
          dry_run: ${{ env.DRY_RUN }}
          tag_template: "pymongocrypt-${VERSION}"
          tag_message_template:  "Release PyMongoCrypt ${VERSION}"

  build-dist:
    needs: [pre-publish]
    uses: ./.github/workflows/dist-python.yml
    with:
      ref: ${{ needs.pre-publish.outputs.version }}

  static-python:
    needs: [pre-publish]
    uses: ./.github/workflows/codeql-python.yml
    with:
      ref: ${{ needs.pre-publish.outputs.version }}

  static-actions:
    needs: [pre-publish]
    uses: ./.github/workflows/codeql-actions.yml
    with:
      ref: ${{ needs.pre-publish.outputs.version }}

  publish:
    needs: [build-dist, static-python, static-actions]
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment: release-python
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          name: all-dist-${{ github.run_id }}
          path: dist/
      - name: Publish package distributions to PyPI
        if: startsWith(env.DRY_RUN, 'false')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  post-publish:
    needs: [publish]
    runs-on: ubuntu-latest
    environment: release-python
    permissions:
      id-token: write
      contents: write
      attestations: write
      security-events: write
    steps:
      - uses: mongodb-labs/drivers-github-tools/secure-checkout@11cb3898ea71493d38e8cdea7cc17b44320899e5  # v3.0.7
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: mongodb-labs/drivers-github-tools/setup@11cb3898ea71493d38e8cdea7cc17b44320899e5  # v3.0.7
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_REGION_NAME }}
          aws_secret_id: ${{ secrets.AWS_SECRET_ID }}
      - uses: mongodb-labs/drivers-github-tools/python/post-publish@11cb3898ea71493d38e8cdea7cc17b44320899e5  # v3.0.7
        with:
          following_version: ${{ env.FOLLOWING_VERSION }}
          working_directory: ./bindings/python
          product_name: ${{ env.PRODUCT_NAME }}
          sbom_in_path: bindings/python/sbom.json
          kondukto_sub_project: pymongocrypt
          evergreen_project: ${{ env.EVERGREEN_PROJECT }}
          tag_template: "pymongocrypt-${VERSION}"
          token: ${{ github.token }}
          dry_run: ${{ env.DRY_RUN }}